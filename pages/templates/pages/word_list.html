<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <h1>Word List (First 10 Records)</h1>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Language 1</th>
                <th>Language 2</th>
                <th>Meaning</th>
                <th>Added Date</th>
            </tr>
        </thead>
        <tbody>
            {% for word in words %}
            <tr>
                <td>{{ word.adwordid }}</td>
                <td>{{ word.language1 }}</td>
                <td>{{ word.language2 }}</td>
                <td>{{ word.meaning }}</td>
                <td>{{ word.addeddate }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No words found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
