{% extends 'base.html' %}
{% load static %}

{% block title %}Wachtwoord Reset Voltooid - PowerTaal{% endblock %}

{% block content %}
<!-- Password Reset Complete Section -->
<section class="password-reset-complete-section">
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="form-container">
                    <h2>Wachtwoord Reset Voltooid</h2>
                    <div class="alert alert-success">
                        <p>Uw wachtwoord is succesvol gewijzigd!</p>
                        <p>U kunt nu inloggen met uw nieuwe wachtwoord.</p>
                    </div>
                    <div class="text-center mt-4">
                        <a href="{% url 'users:login' %}" class="form-button">Inloggen</a>
                    </div>
                    
                    <div class="language-selector">
                        <button class="language-btn active">
                            <span class="flag nl"></span>
                            NL
                        </button>
                        <button class="language-btn">
                            <span class="flag en"></span>
                            EN
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
