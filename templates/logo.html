<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerTaal Logo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
        }
        
        .logo-circle {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #ff6600;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid white;
            overflow: hidden;
        }
        
        .logo-circle::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            border: 3px solid #ff6600;
            box-shadow: inset 0 0 0 2px white;
        }
        
        .logo-circle::before {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #00b0f0;
            z-index: 1;
        }
        
        .logo-text {
            position: relative;
            z-index: 2;
            color: white;
            font-size: 42px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            font-family: 'Bookerly', sans-serif;
        }
        
        .brand-name {
            margin-left: 15px;
            font-size: 48px;
            font-weight: bold;
            color: #ff6600;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            font-family: Arial, sans-serif;
        }
        
        /* Voor gebruik in andere pagina's */
        .logo-small {
            transform: scale(0.5);
            transform-origin: left center;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo-circle">
            <div class="logo-text">PT</div>
        </div>
        <div class="brand-name">PowerTaal</div>
    </div>
</body>
</html>
